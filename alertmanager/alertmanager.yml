# 모니터링 VM(192.168.100.107)의 /etc/alertmanager/alertmanager.yml 로 복사해 사용한다.
# 배포 방식: apt 패키지(prometheus-alertmanager) + systemd (Docker Compose 아님).
# Prometheus·Loki·Grafana 와 같은 방식이다 (AGENTS.md 핵심 규칙).
#
# 수신처는 디스코드다 (orbit-observability#33, 2026-10-19 결정. #29 의 슬랙 결정을 대체한다).
# 디스코드 웹후크의 슬랙 호환 엔드포인트를 쓰므로 블록 이름은 slack_configs 다 — 아래 receivers 주석 참고.
#
# 패키지 버전은 0.26.0 (Ubuntu). matchers / source_matchers(0.22+), api_url_file(0.25+)
# 모두 동작한다. 설치 후 `alertmanager --version` 으로 확인한다.

global:
  resolve_timeout: 5m

route:
  receiver: orbit-default

  # 같은 원인으로 한꺼번에 터지는 알림을 한 통으로 묶는다.
  # namespace 를 넣는 이유: orbit namespace 작업과 클러스터 전역 알림을 섞지 않는다.
  group_by: [alertname, namespace]
  group_wait: 30s
  group_interval: 5m

  # 미해결 알림 재통지 간격. 부하 실험 중 같은 알림이 반복 통지돼 묻히지 않도록 길게 둔다.
  repeat_interval: 12h

  routes:
    # Watchdog 는 "알림 경로가 살아있다" 를 증명하기 위해 항상 발화한다. 사람에게 보내지 않는다.
    - receiver: orbit-null
      matchers:
        - severity = none
      group_wait: 0s
      repeat_interval: 1h

inhibit_rules:
  # target 이 내려가면 그 target 의 지표를 쓰는 알림이 함께 터진다(또는 값이 사라져 오탐이 된다).
  # 원인 알림(TargetDown)만 남기고 같은 instance 의 warning 은 누른다.
  - source_matchers:
      - alertname = TargetDown
    target_matchers:
      - severity = warning
    equal: [instance]

  # HikariConnectionsPending 은 warning(> 10)·critical(> 100) 두 단계가 같은 alertname 이라
  # (Runbook anchor 보존) 같은 Pod 에서 동시에 발화한다. 심각한 쪽만 남긴다.
  - source_matchers:
      - alertname = HikariConnectionsPending
      - severity = critical
    target_matchers:
      - alertname = HikariConnectionsPending
      - severity = warning
    equal: [pod]

receivers:
  # 디스코드로 통지한다. 블록이 slack_configs 인 것은 오타가 아니다:
  # VM 파일에 둔 URL 이 디스코드 웹후크의 **슬랙 호환 엔드포인트**(URL 끝에 /slack)라서,
  # 디스코드가 슬랙 payload 를 그대로 해석한다.
  #
  # 네이티브 discord_configs 를 쓰지 않는 이유: 설치본 0.26.0 의 discord_configs 에는
  # webhook_url 만 있고 webhook_url_file 이 없다(0.27.0 에서 추가됨). 파일 참조가 안 되면
  # 웹후크 URL 을 이 파일에 인라인으로 적어야 하고, 그러면 비밀값을 커밋하게 된다.
  #
  # 비밀값(webhook URL)은 커밋하지 않고 VM 파일에만 둔다
  # (/etc/alertmanager/discord-webhook-url). api_url_file 은 0.25+ 에서 동작한다.
  # 파일 소유자는 Alertmanager 서비스 계정(Ubuntu 패키지: prometheus)이어야 한다.
  # root:root 0600 으로 두면 통지 시점에 permission denied 로 실패한다 (README 참고).
  - name: orbit-default
    slack_configs:
      - api_url_file: /etc/alertmanager/discord-webhook-url
        send_resolved: true

        # channel 은 두지 않는다. 디스코드 웹후크는 만들 때 고른 채널로 고정되고
        # payload 의 channel 은 무시되므로, 적어 두면 틀린 정보만 남는다.
        # 받는 채널은 README "수신처" 절에 적는다.

        # color 는 슬랙 스키마의 attachments 필드다. danger/good 을 디스코드도 받는 것을
        # 실제 웹후크로 확인했다 — hex 로 바꿀 필요 없다 (README "전송 확인" 참고).
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'

        # title_link 를 기본 템플릿에 맡기면 통지가 400 으로 실패한다. 기본값
        # slack.default.titlelink 는 {{ .ExternalURL }}/#/alerts?receiver=... 로 펼쳐지는데,
        # --web.external-url 을 주지 않으면 .ExternalURL 이 호스트명으로 채워져
        # http://astra-monitoring:9093/... 이 된다. 디스코드는 attachment 의 URL 을 검증하고
        # TLD 없는 호스트를 거부한다 → 400 {"attachments": ["0"]}. 실제로 두 번 밟았다.
        #
        # 그래서 여기에 IP 로 명시한다. --web.external-url 로 고치는 방법도 있지만 그건
        # /etc/default/prometheus-alertmanager 의 ARGS 라 저장소 밖 상태다 (README 참고).
        # 9093 은 Tailscale 출발지만 허용하므로 이 링크는 Tailscale 에 붙어 있어야 열린다.
        title_link: 'http://192.168.100.107:9093/#/alerts?receiver={{ .Receiver | urlquery }}'
        text: >-
          {{ range .Alerts }}{{ .Annotations.summary }}
          {{ with .Annotations.description }}{{ . }}
          {{ end }}{{ with .Annotations.runbook_url }}Runbook: {{ . }}
          {{ end }}{{ end }}

  # Watchdog 전용 sink.
  - name: orbit-null
