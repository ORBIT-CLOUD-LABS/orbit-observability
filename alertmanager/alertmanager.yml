# 모니터링 VM(192.168.100.107)의 /etc/alertmanager/alertmanager.yml 로 복사해 사용한다.
# 배포 방식: apt 패키지(prometheus-alertmanager) + systemd (Docker Compose 아님).
# Prometheus·Loki·Grafana 와 같은 방식이다 (AGENTS.md 핵심 규칙).
#
# 수신처는 디스코드다 (orbit-observability#29, 2026-10-19 결정).
# 모니터링 VM 에서 외부 egress 가 열려 있는 것을 확인했다 (https://slack.com -> 200).
#
# 패키지 버전은 0.26.0 (Ubuntu). matchers / source_matchers(0.22+), api_url_file(0.25+)
# 모두 동작한다. 설치 후 `alertmanager --version` 으로 확인한다.

global:
  resolve_timeout: 5m

route:
  receiver: orbit-default

  # 같은 원인으로 한꺼번에 터지는 알림을 한 통으로 묶는다.
  # namespace 를 넣는 이유: orbit namespace 작업과 클러스터 전역 알림을 섞지 않는다.
  group_by: [alertname, namespace]
  group_wait: 30s
  group_interval: 5m

  # 미해결 알림 재통지 간격. 부하 실험 중 같은 알림이 반복 통지돼 묻히지 않도록 길게 둔다.
  repeat_interval: 12h

  routes:
    # Watchdog 는 "알림 경로가 살아있다" 를 증명하기 위해 항상 발화한다. 사람에게 보내지 않는다.
    - receiver: orbit-null
      matchers:
        - severity = none
      group_wait: 0s
      repeat_interval: 1h

inhibit_rules:
  # target 이 내려가면 그 target 의 지표를 쓰는 알림이 함께 터진다(또는 값이 사라져 오탐이 된다).
  # 원인 알림(TargetDown)만 남기고 같은 instance 의 warning 은 누른다.
  - source_matchers:
      - alertname = TargetDown
    target_matchers:
      - severity = warning
    equal: [instance]

receivers:
  # 디스코드로 통지한다. 비밀값(webhook URL)은 커밋하지 않고 VM 파일에만 둔다
  # (/etc/alertmanager/discord-webhook-url, 0600 root:root).
  #
  # discord_configs 를 쓰지 않는 이유: 0.26.0 의 discord_configs 에는 webhook_url 만 있고
  # webhook_url_file 이 없어서(0.28.0 에서 추가됨) URL 이 이 파일에 박힌다. 디스코드는
  # webhook URL 뒤에 /slack 을 붙이면 Slack 호환 payload 를 받으므로, api_url_file 을
  # 지원하는 slack_configs 로 보낸다. VM 파일에 저장하는 URL 끝에 /slack 을 포함한다.
  # Alertmanager 를 0.28 이상으로 올리면 discord_configs + webhook_url_file 로 바꾼다.
  - name: orbit-default
    slack_configs:
      - api_url_file: /etc/alertmanager/discord-webhook-url
        send_resolved: true

        # 디스코드는 Slack 의 channel·icon_emoji·mrkdwn·mrkdwn_in 을 무시한다.
        # 실제 채널은 webhook 자체가 정한다. channel 은 Slack 스키마용으로만 둔다.
        channel: "#orbit-alerts"

        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}{{ .Annotations.summary }}
          {{ with .Annotations.description }}{{ . }}
          {{ end }}{{ with .Annotations.runbook_url }}Runbook: {{ . }}
          {{ end }}{{ end }}

  # Watchdog 전용 sink.
  - name: orbit-null
